# ===============================================================
# Configuraci\u00c3\u00b3n de Parqueadero Autos Colombia
# \u00e2\u009a\u00a0 ARCHIVO LOCAL - NO SUBIR A GITHUB (ver .gitignore)
# ===============================================================
server.port=8081
spring.application.name=parqueadero
logging.level.org.springframework.security=DEBUG

# ===============================================================
# Base de datos PostgreSQL Local
# ===============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/AutosColombia
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Black Cat-03
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuraci\u00c3\u00b3n Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===============================================================
# Configuraci\u00c3\u00b3n JWT (Tokens)
# ===============================================================
autoscolombia.security.jwt.secret=YXV0b3Njb2xvbWJpYVNlY3JldEtleTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
autoscolombia.security.jwt.expiration=86400000
autoscolombia.security.jwt.issuer=AutosColombia-API

