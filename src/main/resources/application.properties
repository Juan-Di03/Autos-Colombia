# ===============================================================
# Configuración de Parqueadero Autos Colombia
# ===============================================================
server.port=8080
spring.application.name=parqueadero

# Base de datos local persistente H2 (en modo compatible con PostgreSQL)
spring.datasource.url=jdbc:h2:file:./data/autos_colombia_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web H2 para inspección rápida (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

