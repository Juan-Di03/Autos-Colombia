<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Parqueadero Autos Colombia</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d5c52 0%, #064039 100%);
            padding: 1.5rem;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
        }
        .login-brand-badge {
            background-color: var(--primary-color);
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-brand-badge">P</div>
            <h1 class="h3 fw-bold text-dark mb-1">Autos Colombia</h1>
            <p class="text-muted small">Sistema de Control Operativo y Parqueadero</p>
        </div>

        <!-- Alertas de error / logout -->
        <div th:if="${errorLogin != null}" class="figma-alert-danger d-flex align-items-center gap-2 small py-2 mb-3">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorLogin}">Error al iniciar sesión</span>
        </div>
        <div th:if="${mensajeLogout != null}" class="figma-alert-success d-flex align-items-center gap-2 small py-2 mb-3">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${mensajeLogout}">Sesión cerrada</span>
        </div>

        <form th:action="@{/login}" method="post" th:object="${authRequest}">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-dark">Documento o Correo</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" th:field="*{identificador}" class="form-control border-start-0" 
                           placeholder="Ej. admin@autoscolombia.co o 1000000001" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-dark">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" th:field="*{password}" class="form-control border-start-0" 
                           placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-primary-action w-100 justify-content-center py-2 fs-6">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Ingresar al Sistema</span>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a th:href="@{/consultar-celda}" class="text-decoration-none small text-muted">
                <i class="bi bi-geo-alt me-1"></i> ¿Eres cliente? Consulta tu celda aquí
            </a>
        </div>
    </div>
</div>
</body>
</html>
